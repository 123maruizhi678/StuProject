<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学生智能助手</title>
<link rel="stylesheet" href="/static/css/student/student-assistant.css"></head><body><header><div><h1>学生智能助手</h1><p class="muted">请假、反馈、学业与生活服务，一个入口</p></div><button id="logout" class="secondary hidden">退出登录</button></header>
<div id="status" role="status" aria-live="polite"></div>

<main id="workspace" class="hidden"><section class="panel"><div class="row"><h2>和学生助手聊聊</h2><button id="newChat" class="secondary">新会话</button></div><p class="muted">你可以描述请假、投诉、学业或生活问题。办理类操作会先让你确认。</p><div id="chat" class="chat" role="log" aria-live="polite"></div><div id="pending" class="hidden"></div><form id="chatForm"><label for="message">你的消息</label><textarea id="message" rows="3" maxlength="5000" required placeholder="例如：我想反馈课程安排变更的问题"></textarea><button type="submit" style="margin-top:10px">发送</button></form>
<details><summary>直接填写请假或反馈</summary><form id="leaveForm"><h3>请假申请</h3><label for="leaveType">请假类型</label><select id="leaveType"><option value="personal">事假</option><option value="sick">病假</option></select><label for="leaveReason">申请原因</label><textarea id="leaveReason" required maxlength="5000"></textarea><div class="row"><div><label for="leaveStart">开始时间（本地时区）</label><input id="leaveStart" type="datetime-local" required></div><div><label for="leaveEnd">结束时间（本地时区）</label><input id="leaveEnd" type="datetime-local" required></div></div><button style="margin-top:12px">提交请假</button></form><hr style="border:0;border-top:1px solid #dbe4ec;margin:22px 0"><form id="ticketForm"><h3>投诉与建议</h3><label for="ticketType">反馈类型</label><select id="ticketType"><option value="complaint">投诉</option><option value="suggestion">建议</option></select><label for="category">问题类别</label><select id="category"><option value="other">其他</option><option value="teaching">教学</option><option value="service">服务</option><option value="application">申请</option><option value="visa">签证</option></select><label for="content">详细内容</label><textarea id="content" maxlength="5000" required></textarea><button style="margin-top:12px">提交反馈</button></form></details></section>
<section class="panel"><h2>我的业务记录</h2><div id="tabs" class="tabs"></div><div id="records"></div><div class="row" style="margin-top:12px"><button id="previous" class="secondary">上一页</button><span id="page" class="muted"></span><button id="next" class="secondary">下一页</button><button id="refresh" class="secondary">刷新</button></div></section></main>
<script src="/static/js/common/api.js"></script><script src="/static/js/student/student-assistant.js"></script></body></html>
