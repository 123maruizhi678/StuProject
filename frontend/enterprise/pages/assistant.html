  <header class="page-heading"><div><span class="eyebrow">WORKSPACE / ASSISTANT</span><h1>智能助手</h1><p>用自然语言处理日常业务、查找数据与获取制度解答。</p></div><span class="connection"><i></i>智能协作</span></header>
  <div class="assistant-layout"><section class="panel assistant-card"><div class="panel-heading"><h2>从一句话开始</h2><span class="status-pill">AI ASSISTANT</span></div><form id="assistant-form"><label for="assistant-text" class="muted">描述你想完成的工作</label><textarea id="assistant-text" placeholder="例如：提交今天的日报，完成客户回访和项目资料整理。" maxlength="10000" required></textarea><div class="assistant-controls"><select id="assistant-mode" aria-label="助手模式"></select><label id="voice-control" class="file-button" hidden>＋ 上传语音<input id="audio" type="file" accept="audio/*" hidden></label><button type="submit">发送 ↗</button></div></form><p id="notice" role="status" aria-live="polite"></p></section><section class="assistant-hints"><span class="eyebrow">WORK SMARTER</span><h2>让日常工作更简单</h2><p class="muted">选择一种模式，描述你要完成的事项。涉及业务写入时，请核对预览后确认办理。</p><div id="suggestions"></div><p class="muted" style="margin:22px 0 0">助手仅处理当前账户已授权的业务和数据。</p></section></div>
