<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="智能报告 · 科技 HUD 单页应用（列表 / 生成 / 详情 / 配置）">
  <title>智能报告 · 留学项目平台</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/report/report.css">
</head>
<body>
  <!-- 氛围层 -->
  <div class="fx" aria-hidden="true">
    <div class="fx-grid"></div>
    <div class="fx-scan"></div>
    <div class="fx-glow"></div>
  </div>

  <!-- 顶部导航 -->
  <header class="topbar">
    <div class="brand">
      <div class="logo"><span></span></div>
      <div class="brand-text">
        <div class="name">智能报告</div>
        <div class="sub">INTELLIGENT REPORT</div>
      </div>
    </div>
    <div class="top-actions">
      <span class="badge" id="identityBadge" hidden></span>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="切换主题">☾</button>
      <button class="icon-btn" id="refreshBtn" type="button" aria-label="刷新列表">↻</button>
    </div>
  </header>

  <main class="content">

    <!-- 登录 / 权限门 -->
    <section class="card login-card" id="loginCard">
      <div class="card-title"><h2>智能报告</h2></div>
      <p class="hint">请先在平台登录。账号需具备「智能报告」读取权限（report.read）。</p>
      <p class="error" id="loginError"></p>
    </section>

    <!-- 工作区：列表 + 配置 -->
    <div id="workspace" hidden>

      <section class="card">
        <div class="card-head">
          <div class="card-title">
            <h2>报告列表</h2>
            <span class="card-code">REPORT LIBRARY</span>
          </div>
          <button class="btn primary" id="generateBtn" type="button" hidden>＋ 生成报告</button>
        </div>
        <div class="filters">
          <input id="filterCode" type="text" placeholder="报告代码（如 mental_weekly）" aria-label="按报告代码筛选">
          <select id="filterStatus" aria-label="按状态筛选">
            <option value="">全部状态</option>
            <option value="pending">待生成</option>
            <option value="running">生成中</option>
            <option value="success">已生成</option>
            <option value="failed">失败</option>
          </select>
        </div>
        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th>编号</th>
                <th>报告名称</th>
                <th>报告代码</th>
                <th>统计窗口</th>
                <th>状态</th>
                <th>生成时间</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="reportRows"></tbody>
          </table>
        </div>
        <div class="pager">
          <span id="pageInfo"></span>
          <button class="btn sm" id="prevPage" type="button">上一页</button>
          <button class="btn sm" id="nextPage" type="button">下一页</button>
        </div>
      </section>

      <section class="card" id="configCard" hidden>
        <div class="card-head">
          <div class="card-title">
            <h2>报告配置</h2>
            <span class="card-code">CONFIG</span>
          </div>
        </div>
        <div id="configList"></div>
      </section>

    </div>

    <!-- 生成报告 -->
    <section class="card" id="generateCard" hidden>
      <div class="card-head">
        <div class="card-title">
          <h2>生成报告</h2>
          <span class="card-code">GENERATE</span>
        </div>
        <button class="btn ghost sm" id="genCancel" type="button">关闭</button>
      </div>
      <p class="hint">统计窗口可留空（使用该报告的默认周期）；填写时开始与截止须成对，且截止晚于开始。</p>
      <div class="form-row">
        <input id="genCode" type="text" placeholder="报告代码（如 mental_weekly）" aria-label="报告代码">
        <input id="genStart" type="datetime-local" aria-label="开始时间">
        <input id="genEnd" type="datetime-local" aria-label="截止时间">
        <button class="btn primary" id="genSubmit" type="button">生成</button>
      </div>
      <p class="error" id="genError" hidden></p>
    </section>

    <!-- 报告详情 -->
    <section class="card" id="detailCard" hidden>
      <div class="card-head">
        <div class="card-title">
          <h2 id="detailTitle"></h2>
          <span class="card-code" id="detailCode"></span>
        </div>
        <button class="btn ghost sm" id="detailClose" type="button">关闭</button>
      </div>
      <dl class="meta" id="detailMeta"></dl>
      <div class="metrics" id="detailMetrics"></div>
      <p class="error" id="detailFail" hidden></p>
      <div class="markdown" id="detailContent"></div>
    </section>

  </main>

  <div class="toast-wrap" id="toasts" role="status" aria-live="polite"></div>

  <script type="module" src="../js/report/report.js"></script>
</body>
</html>
