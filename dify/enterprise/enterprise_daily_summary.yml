kind: app
version: 0.5.0
dependencies: []
app:
  name: StuProject-企业-summary
  description: StuProject企业管理模块 enterprise-v1；仅业务候选及已授权输入，不具备数据库写入工具
  mode: workflow
  icon: 🏢
  icon_background: '#E0E7FF'
  use_icon_as_answer_icon: false
workflow:
  environment_variables: []
  conversation_variables: []
  features:
    file_upload:
      enabled: false
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    suggested_questions_after_answer:
      enabled: false
  graph:
    nodes:
    - id: start
      type: custom
      position:
        x: 50
        y: 200
      positionAbsolute:
        x: 50
        y: 200
      width: 260
      height: 100
      sourcePosition: right
      targetPosition: left
      data:
        type: start
        title: 授权输入
        selected: false
        variables:
        - variable: content
          label: content
          type: paragraph
          required: true
          max_length: 60000
          options: []
        - variable: report_date
          label: report_date
          type: paragraph
          required: true
          max_length: 60000
          options: []
        - variable: contract_version
          label: contract_version
          type: paragraph
          required: true
          max_length: 60000
          options: []
    - id: llm
      type: custom
      position:
        x: 380
        y: 200
      positionAbsolute:
        x: 380
        y: 200
      width: 260
      height: 100
      sourcePosition: right
      targetPosition: left
      data:
        type: llm
        title: 企业summary
        selected: false
        model:
          provider: langgenius/deepseek/deepseek
          name: deepseek-flash
          mode: chat
          completion_params:
            temperature: 0.1
        prompt_template:
        - id: system
          role: system
          text: 仅概括给定本人已提交日报，不调用任何工具，不扩展到其他员工或未提供的业务。按核心进展、关键产出、潜在风险组织简洁中文摘要；不创造数字、承诺和完成事实。输出JSON对象：contract_version="enterprise-v1",summary字符串。
        - id: user
          role: user
          text: 'content: {{#start.content#}}

            report_date: {{#start.report_date#}}

            contract_version: {{#start.contract_version#}}'
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
        memory: null
    - id: validate
      type: custom
      position:
        x: 710
        y: 200
      positionAbsolute:
        x: 710
        y: 200
      width: 260
      height: 100
      sourcePosition: right
      targetPosition: left
      data:
        type: code
        title: 结果契约校验
        selected: false
        code_language: python3
        code: "import json, re\ndef main(raw: str) -> dict:\n    text = re.sub(r\"\
          <think>[\\s\\S]*?</think>\", \"\", raw, flags=re.I).strip()\n    if text.startswith(\"\
          ```\"):\n        text = text.split(\"\\n\",1)[1].rsplit(\"```\",1)[0].strip()\n\
          \    result = json.loads(text)\n    if not isinstance(result,dict) or result.get(\"\
          contract_version\") != \"enterprise-v1\":\n        raise ValueError(\"Invalid\
          \ enterprise result contract\")\n    if not isinstance(result.get('summary'),str):\n\
          \        raise ValueError(\"Invalid summary output type\")\n    return {\"\
          result\":result}\n"
        variables:
        - variable: raw
          value_selector:
          - llm
          - text
        outputs:
          result:
            type: object
            children: null
    - id: end
      type: custom
      position:
        x: 1040
        y: 200
      positionAbsolute:
        x: 1040
        y: 200
      width: 260
      height: 100
      sourcePosition: right
      targetPosition: left
      data:
        type: end
        title: 结构化输出
        selected: false
        outputs:
        - variable: result
          value_selector:
          - validate
          - result
          value_type: object
    edges:
    - id: start-llm
      source: start
      target: llm
      sourceHandle: source
      targetHandle: target
      type: custom
      data:
        sourceType: start
        targetType: llm
        isInIteration: false
        isInLoop: false
      zIndex: 0
    - id: llm-validate
      source: llm
      target: validate
      sourceHandle: source
      targetHandle: target
      type: custom
      data:
        sourceType: llm
        targetType: code
        isInIteration: false
        isInLoop: false
      zIndex: 0
    - id: validate-end
      source: validate
      target: end
      sourceHandle: source
      targetHandle: target
      type: custom
      data:
        sourceType: code
        targetType: end
        isInIteration: false
        isInLoop: false
      zIndex: 0
    viewport:
      x: 0
      y: 0
      zoom: 0.7
