kind: app
version: 0.5.0
dependencies: []
app:
  name: StuProject-企业-extract
  description: StuProject企业管理模块 enterprise-v1；仅业务候选及已授权输入，不具备数据库写入工具
  mode: workflow
  icon: 🏢
  icon_background: '#E0E7FF'
  use_icon_as_answer_icon: false
workflow:
  environment_variables: []
  conversation_variables: []
  features:
    file_upload:
      enabled: false
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    suggested_questions_after_answer:
      enabled: false
  graph:
    nodes:
    - id: start
      type: custom
      position:
        x: 50
        y: 200
      positionAbsolute:
        x: 50
        y: 200
      width: 260
      height: 100
      sourcePosition: right
      targetPosition: left
      data:
        type: start
        title: 授权输入
        selected: false
        variables:
        - variable: text
          label: text
          type: paragraph
          required: true
          max_length: 60000
          options: []
        - variable: action_catalog
          label: action_catalog
          type: paragraph
          required: true
          max_length: 60000
          options: []
        - variable: field_schema
          label: field_schema
          type: paragraph
          required: true
          max_length: 60000
          options: []
        - variable: context
          label: context
          type: paragraph
          required: true
          max_length: 60000
          options: []
        - variable: contract_version
          label: contract_version
          type: paragraph
          required: true
          max_length: 60000
          options: []
    - id: llm
      type: custom
      position:
        x: 380
        y: 200
      positionAbsolute:
        x: 380
        y: 200
      width: 260
      height: 100
      sourcePosition: right
      targetPosition: left
      data:
        type: llm
        title: 企业extract
        selected: false
        model:
          provider: langgenius/deepseek/deepseek
          name: deepseek-flash
          mode: chat
          completion_params:
            temperature: 0.1
        prompt_template:
        - id: system
          role: system
          text: 只提取内部员工请求的动作和字段，不执行动作、不生成SQL、不自行补造身份或业务事实。仅从action_catalog选action，target只能引用context中提供的已授权候选；无法唯一定位则needs_clarification=true。fields严格按field_schema，只输出已提供的信息。输出JSON对象，包含contract_version="enterprise-v1",
            action, target, fields, missing_fields数组, needs_clarification布尔值。 target必须始终为JSON对象；新增动作target={}，修改动作target={"id":候选整数ID}。target绝不能是null、字符串或数组。missing_fields必须始终为数组，无缺失用[]；needs_clarification必须为布尔值。示例：{"contract_version":"enterprise-v1","action":"daily.create","target":{},"fields":{"report_date":"2026-10-17","submitted_content":"完成检查"},"missing_fields":[],"needs_clarification":false}。
        - id: user
          role: user
          text: 'text: {{#start.text#}}

            action_catalog: {{#start.action_catalog#}}

            field_schema: {{#start.field_schema#}}

            context: {{#start.context#}}

            contract_version: {{#start.contract_version#}}'
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
        memory: null
    - id: validate
      type: custom
      position:
        x: 710
        y: 200
      positionAbsolute:
        x: 710
        y: 200
      width: 260
      height: 100
      sourcePosition: right
      targetPosition: left
      data:
        type: code
        title: 结果契约校验
        selected: false
        code_language: python3
        code: "import json, re\ndef main(raw: str) -> dict:\n    text = re.sub(r\"\
          <think>[\\s\\S]*?</think>\", \"\", raw, flags=re.I).strip()\n    if text.startswith(\"\
          ```\"):\n        text = text.split(\"\\n\",1)[1].rsplit(\"```\",1)[0].strip()\n\
          \    result = json.loads(text)\n    if not isinstance(result,dict) or result.get(\"\
          contract_version\") != \"enterprise-v1\":\n        raise ValueError(\"Invalid\
          \ enterprise result contract\")\n    if not isinstance(result.get('action'),str):\n\
          \        raise ValueError(\"Invalid action output type\")\n    if not isinstance(result.get('target'),dict):\n\
          \        raise ValueError(\"Invalid target output type\")\n    if not isinstance(result.get('fields'),dict):\n\
          \        raise ValueError(\"Invalid fields output type\")\n    if not isinstance(result.get('missing_fields'),list):\n\
          \        raise ValueError(\"Invalid missing_fields output type\")\n    if\
          \ not isinstance(result.get('needs_clarification'),bool):\n        raise\
          \ ValueError(\"Invalid needs_clarification output type\")\n    return {\"\
          result\":result}\n"
        variables:
        - variable: raw
          value_selector:
          - llm
          - text
        outputs:
          result:
            type: object
            children: null
    - id: end
      type: custom
      position:
        x: 1040
        y: 200
      positionAbsolute:
        x: 1040
        y: 200
      width: 260
      height: 100
      sourcePosition: right
      targetPosition: left
      data:
        type: end
        title: 结构化输出
        selected: false
        outputs:
        - variable: result
          value_selector:
          - validate
          - result
          value_type: object
    edges:
    - id: start-llm
      source: start
      target: llm
      sourceHandle: source
      targetHandle: target
      type: custom
      data:
        sourceType: start
        targetType: llm
        isInIteration: false
        isInLoop: false
      zIndex: 0
    - id: llm-validate
      source: llm
      target: validate
      sourceHandle: source
      targetHandle: target
      type: custom
      data:
        sourceType: llm
        targetType: code
        isInIteration: false
        isInLoop: false
      zIndex: 0
    - id: validate-end
      source: validate
      target: end
      sourceHandle: source
      targetHandle: target
      type: custom
      data:
        sourceType: code
        targetType: end
        isInIteration: false
        isInLoop: false
      zIndex: 0
    viewport:
      x: 0
      y: 0
      zoom: 0.7
