app:
  description: StuProject企业管理模块 enterprise-v1；仅业务候选及已授权输入，不具备数据库写入工具
  icon: 🤖
  icon_background: '#E0E7FF'
  mode: workflow
  name: StuProject-企业-summary
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/deepseek:0.0.24@9e12eef09973667f0eaf4f082af883167e1de88740b22e71e71488d020c3778a
    version: null
kind: app
version: 0.5.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: llm
      id: start-llm
      source: start
      sourceHandle: source
      target: llm
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: code
      id: llm-validate
      source: llm
      sourceHandle: source
      target: validate
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: end
      id: validate-end
      source: validate
      sourceHandle: source
      target: end
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        selected: false
        title: 授权输入
        type: start
        variables:
        - label: content
          max_length: 60000
          options: []
          required: true
          type: paragraph
          variable: content
        - label: report_date
          max_length: 60000
          options: []
          required: true
          type: paragraph
          variable: report_date
        - label: contract_version
          max_length: 60000
          options: []
          required: true
          type: paragraph
          variable: contract_version
      height: 100
      id: start
      position:
        x: 50
        y: 200
      positionAbsolute:
        x: 50
        y: 200
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 260
    - data:
        context:
          enabled: false
          variable_selector: []
        memory: null
        model:
          completion_params:
            temperature: 0.1
          mode: chat
          name: deepseek-flash
          provider: langgenius/deepseek/deepseek
        prompt_template:
        - id: system
          role: system
          text: 仅概括给定本人已提交日报，不调用任何工具，不扩展到其他员工或未提供的业务。按核心进展、关键产出、潜在风险组织简洁中文摘要；不创造数字、承诺和完成事实。输出JSON对象：contract_version="enterprise-v1",summary字符串。
        - id: user
          role: user
          text: 'content: {{#start.content#}}

            report_date: {{#start.report_date#}}

            contract_version: {{#start.contract_version#}}'
        selected: false
        title: 企业summary
        type: llm
        vision:
          enabled: false
      height: 100
      id: llm
      position:
        x: 380
        y: 200
      positionAbsolute:
        x: 380
        y: 200
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 260
    - data:
        code: "import json, re\ndef main(raw: str) -> dict:\n    text = re.sub(r\"\
          <think>[\\s\\S]*?</think>\", \"\", raw, flags=re.I).strip()\n    if text.startswith(\"\
          ```\"):\n        text = text.split(\"\\n\",1)[1].rsplit(\"```\",1)[0].strip()\n\
          \    result = json.loads(text)\n    if not isinstance(result,dict) or result.get(\"\
          contract_version\") != \"enterprise-v1\":\n        raise ValueError(\"Invalid\
          \ enterprise result contract\")\n    if not isinstance(result.get('summary'),str):\n\
          \        raise ValueError(\"Invalid summary output type\")\n    return {\"\
          result\":result}\n"
        code_language: python3
        outputs:
          result:
            children: null
            type: object
        selected: false
        title: 结果契约校验
        type: code
        variables:
        - value_selector:
          - llm
          - text
          variable: raw
      height: 100
      id: validate
      position:
        x: 710
        y: 200
      positionAbsolute:
        x: 710
        y: 200
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 260
    - data:
        outputs:
        - value_selector:
          - validate
          - result
          value_type: object
          variable: result
        selected: false
        title: 结构化输出
        type: end
      height: 100
      id: end
      position:
        x: 1040
        y: 200
      positionAbsolute:
        x: 1040
        y: 200
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 260
    viewport:
      x: 0
      y: 0
      zoom: 0.7
  rag_pipeline_variables: []
