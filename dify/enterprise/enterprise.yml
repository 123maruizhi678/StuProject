    - data:
        context:
          enabled: false
          variable_selector: []
        memory: null
        model:
          completion_params:
            temperature: 0.1
          mode: chat
          name: deepseek-flash
          provider: langgenius/deepseek/deepseek
        prompt_template:
        - id: system
          role: system
          text: 只提取内部员工请求的动作和字段，不执行动作、不生成SQL、不自行补造身份或业务事实。仅从action_catalog选action，target只能引用context中提供的已授权候选；无法唯一定位则needs_clarification=true。fields严格按field_schema，只输出已提供的信息。输出JSON对象，包含contract_version="enterprise-v1",
            action, target, fields, missing_fields数组, needs_clarification布尔值。 target必须始终为JSON对象；新增动作target={}，修改动作target={"id":候选整数ID}。target绝不能是null、字符串或数组。missing_fields必须始终为数组，无缺失用[]；needs_clarification必须为布尔值。示例：{"contract_version":"enterprise-v1","action":"daily.create","target":{},"fields":{"report_date":"2026-10-17","submitted_content":"完成检查"},"missing_fields":[],"needs_clarification":false}。
        - id: user
          role: user
          text: 'text: {{#unpack.text#}}

            action_catalog: {{#unpack.action_catalog#}}

            field_schema: {{#unpack.field_schema#}}

            context: {{#unpack.context#}}

            contract_version: {{#unpack.contract_version#}}'
        selected: false
        title: 动作提取 · 企业extract
        type: llm
        vision:
          enabled: false
      height: 100
      id: extract-llm
      position:
        x: 1140
        y: 200
      positionAbsolute:
        x: 1140
        y: 200
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 260
    - data:
        code: "import json, re\ndef main(raw: str) -> dict:\n    text = re.sub(r\"\
          <think>[\\s\\S]*?</think>\", \"\", raw, flags=re.I).strip()\n    if text.startswith(\"\
          ```\"):\n        text = text.split(\"\\n\",1)[1].rsplit(\"```\",1)[0].strip()\n\
          \    result = json.loads(text)\n    if not isinstance(result,dict) or result.get(\"\
          contract_version\") != \"enterprise-v1\":\n        raise ValueError(\"Invalid\
          \ enterprise result contract\")\n    if not isinstance(result.get('action'),str):\n\
          \        raise ValueError(\"Invalid action output type\")\n    if not isinstance(result.get('target'),dict):\n\
          \        raise ValueError(\"Invalid target output type\")\n    if not isinstance(result.get('fields'),dict):\n\
          \        raise ValueError(\"Invalid fields output type\")\n    if not isinstance(result.get('missing_fields'),list):\n\
          \        raise ValueError(\"Invalid missing_fields output type\")\n    if\
          \ not isinstance(result.get('needs_clarification'),bool):\n        raise\
          \ ValueError(\"Invalid needs_clarification output type\")\n    return {\"\
          result\":result}\n"
        code_language: python3
        outputs:
          result:
            children: null
            type: object
        selected: false
