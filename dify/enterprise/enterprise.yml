kind: app
version: 0.5.0
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/deepseek:0.0.24@9e12eef09973667f0eaf4f082af883167e1de88740b22e71e71488d020c3778a
    version: null
app:
  name: StuProject-企业-统一工作流
  description: enterprise-v1：scene 分流动作提取、只读查询、知识 QA/RAG、日报摘要；仅接收后端授权输入。
  mode: workflow
  icon: 🏢
  icon_background: '#E0E7FF'
  use_icon_as_answer_icon: false
workflow:
  environment_variables: []
  conversation_variables: []
  features:
    file_upload:
      enabled: false
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    nodes:
    - id: start
      type: custom
      position:
        x: 40
        y: 400
      positionAbsolute:
        x: 40
        y: 400
      width: 260
      height: 100
      sourcePosition: right
      targetPosition: left
      data:
        type: start
        title: 统一企业入口
        selected: false
        variables:
        - variable: scene
          label: 业务场景
          type: select
          required: true
          max_length: 48
          options:
          - extract
          - query
          - knowledge
          - summary
        - variable: payload
          label: 后端授权输入（JSON）
          type: paragraph
          required: true
          max_length: 262144
          options: []
    - id: unpack
      type: custom
      position:
        x: 370
        y: 400
      positionAbsolute:
        x: 370
        y: 400
      width: 260
      height: 100
      sourcePosition: right
      targetPosition: left
      data:
        type: code
        title: 输入契约校验与解包
        selected: false
        code_language: python3
        code: "import json\n\ndef main(scene: str, payload: str) -> dict:\n    fields\
          \ = {'extract': {'text': 'str', 'action_catalog': 'list', 'field_schema':\
          \ 'dict', 'context': 'dict'}, 'query': {'question': 'str', 'schema_context':\
          \ 'dict', 'dialect': 'str', 'query_constraints': 'dict', 'bound_filters':\
          \ 'dict', 'schema_version': 'str'}, 'knowledge': {'question': 'str', 'mode':\
          \ 'str', 'candidates': 'list'}, 'summary': {'content': 'str', 'report_date':\
          \ 'str'}}\n    types = {\"str\": str, \"list\": list, \"dict\": dict}\n\
          \    if scene not in fields:\n        raise ValueError(\"Unsupported enterprise\
          \ scene\")\n    value = json.loads(payload)\n    if not isinstance(value,\
          \ dict) or value.get(\"contract_version\") != \"enterprise-v1\":\n     \
          \   raise ValueError(\"Invalid enterprise input contract\")\n    for key,\
          \ kind in fields[scene].items():\n        if not isinstance(value.get(key),\
          \ types[kind]):\n            raise ValueError(\"Invalid input type: \" +\
          \ key)\n    if scene == \"knowledge\" and value[\"mode\"] not in (\"qa\"\
          , \"rag\"):\n        raise ValueError(\"Invalid knowledge mode\")\n    if\
          \ scene == \"query\" and (value[\"dialect\"] != \"mysql\" or value[\"schema_version\"\
          ] != \"enterprise-query-v1\"):\n        raise ValueError(\"Invalid enterprise\
          \ query contract\")\n    result = {key: \"\" for key in ['action_catalog',\
          \ 'bound_filters', 'candidates', 'content', 'context', 'contract_version',\
          \ 'dialect', 'field_schema', 'mode', 'query_constraints', 'question', 'report_date',\
          \ 'schema_context', 'schema_version', 'text']}\n    for key in fields[scene].keys()\
          \ | {\"contract_version\"}:\n        item = value[key]\n        result[key]\
          \ = json.dumps(item, ensure_ascii=False) if isinstance(item, (dict, list))\
          \ else item\n    return result\n"
        variables:
        - variable: scene
          value_selector:
          - start
          - scene
        - variable: payload
          value_selector:
          - start
          - payload
        outputs:
          action_catalog:
            type: string
            children: null
          bound_filters:
            type: string
            children: null
          candidates:
            type: string
            children: null
          content:
            type: string
            children: null
          context:
            type: string
            children: null
          contract_version:
            type: string
            children: null
          dialect:
            type: string
            children: null
          field_schema:
