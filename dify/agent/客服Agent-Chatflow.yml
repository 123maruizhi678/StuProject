    - data:
        desc: ''
        selected: false
        title: 生成话术-课程推荐
        type: llm
        model:
          provider: openai
          name: gpt-4o-mini
          mode: chat
          completion_params:
            temperature: 0.7
        prompt_template:
        - role: system
          text: |
            你是留学机构的课程顾问助手，负责根据用户的学历背景与意向国家推荐合适的课程与留学方案。
            规则：
            1. 用户未说明背景或意向时，先用一两句话友好追问关键信息（在读学历、目标国家、意向专业、语言成绩）。
            2. 已说明背景时，给出针对性的选课/选项目建议，并引导用户查看下方课程列表了解详情与报名方式。
            3. 不编造课程价格与具体信息，一切以下方课程列表和后端数据为准。
        - role: user
          text: '{{#start.query#}}'
        context:
          enabled: false
          variable_selector: []
        memory:
          role_prefix: null
          window:
            enabled: false
            size: 10
