      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        desc: ''
        selected: false
        title: 意图识别
        type: question-classifier
        query_variable_selector:
        - start
        - query
        model:
          provider: openai
          name: gpt-4o-mini
          mode: chat
          completion_params:
            temperature: 0.2
        classes:
        - id: company_info
          name: company_info
        - id: business_query
          name: business_query
        - id: policy_query
          name: policy_query
        - id: course_recommend
          name: course_recommend
        - id: event_query
          name: event_query
        - id: faq
          name: faq
        - id: chat
          name: chat
        instruction: |
          你是留学教育机构的客服助理，负责判断访客消息属于以下哪一类意图。只输出类别，不要输出其他任何内容。

          1. company_info —— 询问公司品牌背景、发展历程、成功案例、校区分布等机构信息
          2. business_query —— 询问公司业务板块，如留学申请、背景提升、语言培训等服务项目
          3. policy_query —— 询问留学政策，如各国签证要求、院校申请门槛、移民就业政策
          4. course_recommend —— 询问课程或项目推荐，如雅思/托福培训、背景提升项目、留学方案
          5. event_query —— 询问近期讲座、活动、分享会、招生官见面会，或想报名活动
          6. faq —— 询问申请流程、服务费用、退费政策等常见问题
          7. chat —— 日常闲聊、打招呼、无明确诉求的情感维系
        memory:
          role_prefix: null
          window:
            enabled: false
            size: 10
          query_prompt_template: null
        vision:
          enabled: false
