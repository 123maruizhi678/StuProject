version: 1
# Backend API authorization remains mandatory; frontend visibility is not security.
roles:
  admin:
    permissions: [admin.dashboard, report.generate, report.read, report.config.read, report.config.write, customer.source.read, customer.source.create, customer.source.parse, customer.source.file, customer.judge.create, customer.judge.batch, customer.result.read, customer.rule.read, customer.rule.manage]
  employee:
    permissions: [dashboard.employee, student.profile.read, student.admin_service.review, service_ticket.read, service_ticket.handle]
  customer:
    permissions: [dashboard.customer, course_project.read, event_signup.create, service_ticket.create, service_ticket.read_own]
  student:
    permissions: [dashboard.student, student.profile.read_own, student.admin_service.create, student.admin_service.read_own, student.admin_service.withdraw_own, student.notification.read_own, student.mental.create_own, student.reminder.manage_own, student.chat, student.action.confirm, student.academic.read_own, student.progress.read_own, student.course.read_own, student.score.read_own, service_ticket.create, service_ticket.read_own, student.ticket.reply_own, student.ticket.confirm_own, student.ticket.rate_own]
# 员工角色仅由数据库有效档案提供，心理处置使用专属角色。
employee_roles:
  teacher:
    permissions: [student.notification.read]
  academic:
    permissions: [student.academic.maintain]
  consultant:
    permissions: [student.progress.maintain]
  manager:
    permissions: [student.admin_service.assign, student.progress.maintain]
  counselor:
    permissions: [student.notification.read, student.warning.read, student.warning.handle]
# Page IDs and routes are metadata for a future frontend; these do not create pages.
pages:
  home: {title: Home, route: /, public: true}
  login: {title: Login, route: /login, public: true}
  password_reset: {title: Password reset, route: /password-reset, public: true}
  account: {title: Account, route: /account, requires_auth: true}
  agent: {title: 客服 Agent, route: /agent, public: true}
  admin_dashboard: {title: Admin console, route: /admin, requires_auth: true, permission: admin.dashboard}
  employee_dashboard: {title: Employee dashboard, route: /employee, requires_auth: true, permission: dashboard.employee}
  customer_dashboard: {title: Customer dashboard, route: /customer, requires_auth: true, permission: dashboard.customer}
  student_dashboard: {title: Student dashboard, route: /student, requires_auth: true, permission: dashboard.student}
  student_profile: {title: Student profile, route: /student/profile, requires_auth: true, permission_any: [student.profile.read, student.profile.read_own]}
  service_tickets: {title: Service tickets, route: /tickets, requires_auth: true, permission_any: [service_ticket.read, service_ticket.read_own, service_ticket.handle]}
  report: {title: 智能报告, route: /report, requires_auth: true, permission_any: [report.generate, report.read, report.config.read, report.config.write]}
  customer_research: {title: 客户研判, route: /customer/customer.html, requires_auth: true, permission_any: [customer.source.create, customer.result.read]}
modules:
  agent_center: {title: 客服 Agent, pages: [agent]}
  admin_workspace: {title: Administration, required_any: [admin.dashboard], pages: [admin_dashboard]}
  employee_workspace: {title: Employee workspace, required_any: [dashboard.employee, enterprise.access], pages: [employee_dashboard]}
  customer_research: {title: 客户研判, required_any: [customer.source.create, customer.result.read], pages: [customer_research]}
  customer_workspace: {title: Customer workspace, required_any: [dashboard.customer], pages: [customer_dashboard]}
  student_workspace: {title: Student workspace, required_any: [dashboard.student], pages: [student_dashboard, student_profile]}
  ticket_center:
    title: Ticket center
    required_any: [service_ticket.create, service_ticket.read_own, service_ticket.handle]
    pages: [service_tickets]
  report_center:
    title: 智能报告
    required_any: [report.generate, report.read, report.config.read, report.config.write]
    pages: [report]

# 公共工作台与共享导航：仅列出既有接口授权允许的入口。
navigation:
  modules:
  - id: agent_center
    title: 客服咨询
    description: 咨询问答、课程与活动信息
    symbol: ◌
  - id: customer_research
    title: 客户信息研判
    description: 资料解析、规则匹配与研判结果
    symbol: ⌁
  - id: employee_workspace
    title: 企业智能助手
    description: 按岗位协同处理客户、教务与日常事务
    symbol: ▦
  - id: student_workspace
    title: 学生智能助手
    description: 学习、申请与学生服务
    symbol: ◇
  - id: report_center
    title: 智能报告
    description: 查看分析报告与已授权的报告工具
    symbol: ▤
  - id: admin_workspace
    title: 平台管理
    description: 账号、角色与平台管理入口
    symbol: ✦
  - id: account_center
    title: 个人中心
    description: 查看当前身份与个人访问权限
    symbol: ○
  pages:
  - route: /common/password-reset.html
    title: 账号协助
