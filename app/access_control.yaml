version: 1
roles:
  admin:
    permissions:
    - admin.dashboard
  employee:
    permissions:
    - dashboard.employee
    - student.profile.read
    - service_ticket.read
  customer:
    permissions:
    - dashboard.customer
    - course_project.read
    - event_signup.create
  student:
    permissions:
    - dashboard.student
    - student.profile.read_own
    - student.admin_service.create
    - student.admin_service.read_own
    - student.notification.read_own
    - student.admin_service.withdraw_own
    - service_ticket.create
    - service_ticket.read_own
    - student.ticket.reply_own
    - student.ticket.confirm_own
    - student.ticket.rate_own
    - student.mental.create_own
    - student.course.read_own
    - student.score.read_own
    - student.academic.read_own
    - student.progress.read_own
    - student.reminder.manage_own
    - student.chat
    - student.action.confirm
    - course_project.read
pages:
  home:
    title: Home
    route: /
    public: true
  login:
    title: Login
    route: /login
    public: true
  password_reset:
    title: Password reset
    route: /password-reset
    public: true
  account:
    title: Account
    route: /account
    requires_auth: true
  admin_dashboard:
    title: Admin console
    route: /admin
    requires_auth: true
    permission: admin.dashboard
  employee_dashboard:
    title: Employee dashboard
    route: /employee
    requires_auth: true
    permission: dashboard.employee
  customer_dashboard:
    title: Customer dashboard
    route: /customer
    requires_auth: true
    permission: dashboard.customer
  student_dashboard:
    title: Student dashboard
    route: /student
    requires_auth: true
    permission: dashboard.student
  student_profile:
    title: Student profile
    route: /student/profile
    requires_auth: true
    permission_any:
    - student.profile.read
    - student.profile.read_own
  service_tickets:
    title: Service tickets
    route: /tickets
    requires_auth: true
    permission_any:
    - service_ticket.read
    - service_ticket.read_own
    - service_ticket.handle
  student_assistant:
    title: 学生助手
    route: /student-assistant
    requires_auth: true
    permission: student.chat
modules:
  admin_workspace:
    title: Administration
    required_any:
    - admin.dashboard
    pages:
    - admin_dashboard
  employee_workspace:
    title: Employee workspace
    required_any:
    - dashboard.employee
    pages:
    - employee_dashboard
  customer_workspace:
    title: Customer workspace
    required_any:
    - dashboard.customer
    pages:
    - customer_dashboard
  student_workspace:
    title: Student workspace
    required_any:
    - dashboard.student
    pages:
    - student_dashboard
    - student_profile
    - student_assistant
  ticket_center:
    title: Ticket center
    required_any:
    - service_ticket.create
    - service_ticket.read_own
    - service_ticket.handle
    pages:
    - service_tickets
employee_roles:
  teacher:
    permissions:
    - student.admin_service.review
    - student.notification.read
    - student.warning.read
    - student.warning.handle
  manager:
    permissions:
    - student.admin_service.assign
    - student.progress.maintain
    - report.read
  academic:
    permissions:
    - student.academic.maintain
  consultant:
    permissions:
    - student.progress.maintain
